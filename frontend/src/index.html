  <!-- Quick splash - typewriter name -->
  <style>
    html, body { margin: 0; padding: 0; background: #0a1628; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a3d7a 0%, #0a1628 70%);
      transition: opacity 0.25s ease-out;
    }
    #splash-name {
      color: #fff;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #60a5fa;
      width: 0;
      animation: splash-type 0.7s steps(11) forwards, splash-caret 0.6s step-end 3;
      background: linear-gradient(135deg, #60a5fa 0%, #fff 50%, #3b6cb5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #app-splash.hidden { opacity: 0; pointer-events: none; }
    @keyframes splash-type { from { width: 0; } to { width: 11ch; } }
    @keyframes splash-caret { 50% { border-color: transparent; } }
  </style>
</head>
<body>
  <div id="app-splash">
    <div id="splash-name">DGI Assets</div>
  </div>

  <app-root></app-root>

  <script>
    function hideSplash() {
      var splash = document.getElementById('app-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 250);
      }
    }
    // Hide as soon as app is ready (fallback: 900ms)
    var splashTimer = setTimeout(hideSplash, 900);
    window.addEventListener('load', function () {
      clearTimeout(splashTimer);
      setTimeout(hideSplash, 100);
    });
  </script>
</body>
