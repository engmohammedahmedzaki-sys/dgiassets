  <!-- Splash screen styles (prevents FOUC + logo flash) -->
  <style>
    html, body { margin: 0; padding: 0; background: #0a1628; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a3d7a 0%, #0a1628 70%);
      transition: opacity 0.4s ease-out;
    }
    #app-splash img {
      width: 220px;
      max-width: 60vw;
      filter: drop-shadow(0 8px 24px rgba(59, 130, 246, 0.4));
      animation: splash-pulse 2s ease-in-out infinite;
    }
    #app-splash .loader {
      margin-top: 2rem;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    #app-splash.hidden { opacity: 0; pointer-events: none; }
    @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.92; } }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-splash">
    <img src="assets/branding/logo.png" alt="DGI Assets">
    <div class="loader"></div>
  </div>

  <app-root></app-root>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var splash = document.getElementById('app-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 500);
        }
      }, 300);
    });
  </script>
</body>
</html>
