<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">م</div>
      <span class="logo-text" *ngIf="!isCollapsed">منصة المشاريع</span>
    </div>
    <button class="toggle-btn" (click)="toggleSidebar()">
      <span *ngIf="!isCollapsed">«</span>
      <span *ngIf="isCollapsed">»</span>
    </button>
  </div>

  <div class="user-info" *ngIf="currentUser">
    <div class="avatar">{{ getInitials() }}</div>
    <div class="user-details" *ngIf="!isCollapsed">
      <h4>{{ currentUser.fullName }}</h4>
      <span class="role-badge" [class.buyer]="currentUser.role === 'buyer'" [class.seller]="currentUser.role === 'seller'">
        {{ currentUser.role === 'buyer' ? 'مشتري' : 'بائع' }}
      </span>
    </div>
  </div>

  <nav class="nav-menu">
    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       routerLinkActive="active"
       class="nav-item"
       [title]="isCollapsed ? item.label : ''">
      <span class="nav-icon">{{ item.icon }}</span>
      <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
      <span class="badge" *ngIf="item.badge && !isCollapsed">{{ item.badge }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="onLogout()">
      <span class="nav-icon">🚪</span>
      <span *ngIf="!isCollapsed">تسجيل الخروج</span>
    </button>
  </div>
</aside>
