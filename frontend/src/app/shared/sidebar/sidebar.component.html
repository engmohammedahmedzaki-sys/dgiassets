<button class="sidebar-mobile-toggle" (click)="toggleMobile()" aria-label="القائمة">
  {{ isMobileOpen ? '✕' : '☰' }}
</button>

<div class="sidebar-backdrop" [class.show]="isMobileOpen" (click)="closeMobile()"></div>

<aside class="sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">
  <div class="sidebar-header">
    <a routerLink="/" class="sidebar-logo" aria-label="DGI Assets">
      <img [src]="siteSettings?.logoUrl || 'assets/branding/logo.png'" alt="DGI Assets" class="sidebar-logo-img" [class.collapsed]="isCollapsed" />
    </a>
    <button class="toggle-btn" (click)="toggleSidebar()" [attr.aria-label]="isCollapsed ? 'فتح القائمة' : 'طى القائمة'">
      <span *ngIf="!isCollapsed">«</span>
      <span *ngIf="isCollapsed">»</span>
    </button>
  </div>

  <div class="user-info" *ngIf="currentUser">
    <div class="avatar">{{ getInitials() }}</div>
    <div class="user-details" *ngIf="!isCollapsed">
      <h4>{{ currentUser.fullName }}</h4>
      <span class="role-badge" [class.buyer]="currentUser.role === 'buyer'" [class.seller]="currentUser.role === 'seller'" [class.admin]="currentUser.role === 'admin'">
        {{ currentUser.role === 'admin' ? 'مدير النظام' : currentUser.role === 'seller' ? 'بائع' : 'مشتري' }}
      </span>
    </div>
  </div>

  <nav class="nav-menu">
    <a *ngFor="let item of menuItems"
       href="#"
       (click)="onItemClick(item, $event); closeMobile()"
       [class.active]="activeTab === item.route"
       class="nav-item"
       [title]="isCollapsed ? item.label : ''">
      <span class="nav-icon">{{ item.icon }}</span>
      <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
      <span class="badge" *ngIf="item.badge && !isCollapsed">{{ item.badge }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a class="logout-btn mb-2" routerLink="/" style="text-decoration: none;">
      <span class="nav-icon">🏠</span>
      <span *ngIf="!isCollapsed">العودة للموقع</span>
    </a>
    <button class="logout-btn" (click)="onLogout()">
      <span class="nav-icon">🚪</span>
      <span *ngIf="!isCollapsed">تسجيل الخروج</span>
    </button>
  </div>
</aside>
